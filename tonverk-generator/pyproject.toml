[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tonverk-generator"
version = "0.1.0"
description = "Genera progetti per Elektron Tonverk da una descrizione testuale della canzone"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
  "rocksdict>=0.3.29",
  "anthropic>=2.6",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
tvgen = "tvgen.cli:main"

[tool.setuptools.packages.find]
include = ["tvgen*"]

[tool.setuptools.package-data]
"tvgen.web" = ["index.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
